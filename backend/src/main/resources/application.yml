spring:
  application:
    name: music-catalog-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  itunes:
    base-url: ${ITUNES_BASE_URL:https://itunes.apple.com}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
